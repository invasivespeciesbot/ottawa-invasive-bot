name: Run Invasive Species Bot

on:
  schedule:
    - cron: '0 12 * * *' # Runs automatically once every day at 12:00 PM UTC
  workflow_dispatch:      # Allows you to click "Run workflow" manually

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # CRITICAL: Gives GitHub permission to save posted_ids.txt
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests atproto

      - name: Run Python Bot
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python bot.py

      - name: Commit and Save Posting History
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          # Check if there are changes in posted_ids.txt to avoid empty commit errors
          if [[ -n "$(git status --porcelain posted_ids.txt)" ]]; then
            git add posted_ids.txt
            git commit -m "Automated update: log newly posted iNaturalist IDs"
            git push
          else
            echo "No new postings recorded. Skipping history save."
          fi
